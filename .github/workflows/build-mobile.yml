name: Mobile test builds

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android internal-test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Build installable beta APK
        env:
          AWUN_MIRROR_URL: ${{ vars.AWUN_MIRROR_URL }}
        run: gradle -p mobile/android --no-daemon :app:lintDebug :app:assembleDebug
      - name: Prepare Android artifact
        run: |
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/android/SONGVALE-Android-internal-test.apk
          sha256sum dist/android/SONGVALE-Android-internal-test.apk > dist/android/SONGVALE-Android-internal-test.apk.sha256
          cp LICENSE.md EULA.md dist/android/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SONGVALE-Android-internal-test
          path: dist/android
          if-no-files-found: error

  ios:
    name: iOS IPA and Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Configure optional mirror
        if: ${{ vars.AWUN_MIRROR_URL != '' }}
        env:
          AWUN_MIRROR_URL: ${{ vars.AWUN_MIRROR_URL }}
        run: /usr/libexec/PlistBuddy -c "Set :AWUNMirrorURL $AWUN_MIRROR_URL" mobile/ios/AWUN/Info.plist
      - name: Build unsigned device application
        run: >-
          xcodebuild -project mobile/ios/AWUN.xcodeproj -scheme AWUN
          -configuration Release -sdk iphoneos -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build Simulator application
        run: >-
          xcodebuild -project mobile/ios/AWUN.xcodeproj -scheme AWUN
          -configuration Release -sdk iphonesimulator -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS artifacts
        run: |
          mkdir -p dist/ios/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/AWUN.app dist/ios/Payload/AWUN.app
          ditto -c -k --sequesterRsrc --keepParent dist/ios/Payload dist/ios/SONGVALE-iOS-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/AWUN.app dist/ios/SONGVALE-iOS-Simulator.zip
          shasum -a 256 dist/ios/SONGVALE-iOS-unsigned.ipa dist/ios/SONGVALE-iOS-Simulator.zip > dist/ios/SHA256SUMS.txt
          cp LICENSE.md EULA.md dist/ios/
          rm -rf dist/ios/Payload
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SONGVALE-iOS-beta
          path: dist/ios
          if-no-files-found: error

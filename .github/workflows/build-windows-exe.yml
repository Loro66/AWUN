name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-desktop.txt
      - name: Install desktop dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-desktop.txt pytest==9.1.1
      - name: Run release tests
        run: python -m pytest -q
      - name: Build SONGVALE.exe
        run: pyinstaller --noconfirm --clean AWUN.spec
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION -Raw).Trim()
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" "installer\AWUN.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign Windows artifacts when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Host "Signing certificate is not configured; leaving internal-test artifacts unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required when a certificate is configured"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "songvale-signing.pfx"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          foreach ($artifact in @("dist/SONGVALE.exe", "dist/SONGVALE-Setup-x64.exe")) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $artifact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool verify /pa $artifact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $certificate -Force
      - name: Create checksums and release metadata
        shell: pwsh
        run: |
          foreach ($artifact in @("SONGVALE.exe", "SONGVALE-Setup-x64.exe")) {
            $hash = (Get-FileHash "dist/$artifact" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Encoding ascii "dist/$artifact.sha256" "$hash *$artifact"
          }
          Copy-Item LICENSE.md dist/LICENSE.md
          Copy-Item EULA.md dist/EULA.md
      - name: Upload Windows artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SONGVALE-Windows-x64
          path: |
            dist/SONGVALE.exe
            dist/SONGVALE.exe.sha256
            dist/SONGVALE-Setup-x64.exe
            dist/SONGVALE-Setup-x64.exe.sha256
            dist/LICENSE.md
            dist/EULA.md
          if-no-files-found: error
  release:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve release tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a stable semantic version"
          }
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          "SONGVALE_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download Windows artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: SONGVALE-Windows-x64
          path: dist
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:SONGVALE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:SONGVALE_RELEASE_TAG already exists"
            exit 0
          }
          gh release create $env:SONGVALE_RELEASE_TAG `
            dist/SONGVALE.exe `
            dist/SONGVALE.exe.sha256 `
            dist/SONGVALE-Setup-x64.exe `
            dist/SONGVALE-Setup-x64.exe.sha256 `
            dist/LICENSE.md `
            dist/EULA.md `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SONGVALE $env:SONGVALE_RELEASE_TAG" `
            --notes-file AWUN-RELEASE.txt

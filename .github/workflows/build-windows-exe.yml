name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt pytest
      - name: Run release tests
        run: python -m pytest -q
      - name: Build AWUN.exe
        run: pyinstaller --noconfirm --clean AWUN.spec
      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AWUN.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii dist/AWUN.exe.sha256 "$hash *AWUN.exe"
          Copy-Item LICENSE.md dist/LICENSE.md
          Copy-Item EULA.md dist/EULA.md
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION -Raw).Trim()
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" "installer\AWUN.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/AWUN-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii dist/AWUN-Setup-x64.exe.sha256 "$hash *AWUN-Setup-x64.exe"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWUN-Windows-x64
          path: |
            dist/AWUN.exe
            dist/AWUN.exe.sha256
            dist/AWUN-Setup-x64.exe
            dist/AWUN-Setup-x64.exe.sha256
            dist/LICENSE.md
            dist/EULA.md
          if-no-files-found: error
  release:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a stable semantic version"
          }
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          "AWUN_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AWUN-Windows-x64
          path: dist
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:AWUN_RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:AWUN_RELEASE_TAG already exists"
            exit 0
          }
          gh release create $env:AWUN_RELEASE_TAG `
            dist/AWUN.exe `
            dist/AWUN.exe.sha256 `
            dist/AWUN-Setup-x64.exe `
            dist/AWUN-Setup-x64.exe.sha256 `
            dist/LICENSE.md `
            dist/EULA.md `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "AWUN $env:AWUN_RELEASE_TAG" `
            --notes-file AWUN-RELEASE.txt

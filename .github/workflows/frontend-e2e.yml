name: Frontend browser tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/songvale-quiet-forest-2-1-1

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and screenshot tests
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/codex/songvale-quiet-forest-2-1-1" ]]; then
            npx playwright test tests/e2e/capture-release.spec.js
          else
            npm run test:e2e
          fi
      - name: Upload quiet forest previews
        if: github.ref == 'refs/heads/codex/songvale-quiet-forest-2-1-1'
        uses: actions/upload-artifact@v4
        with:
          name: songvale-quiet-forest-previews
          path: release-captures
          if-no-files-found: error
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

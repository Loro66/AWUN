name: Android unsigned Play bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-google-play-unsigned.yml"
      - "mobile/android/**"
      - "frontend/**"
      - "LICENSE.md"
      - "EULA.md"

permissions:
  contents: read

jobs:
  bundle:
    name: Unsigned Play AAB
    runs-on: ubuntu-latest
    env:
      AWUN_VERSION_CODE: "18000"
      AWUN_VERSION_NAME: "1.8.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Lint and build unsigned app bundle
        run: gradle -p mobile/android --no-daemon :app:clean :app:lintRelease :app:bundleRelease
      - name: Package unsigned Play artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find mobile/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab')
          test "${#bundles[@]}" -eq 1
          mkdir -p dist/google-play-unsigned
          cp "${bundles[0]}" "dist/google-play-unsigned/AWUN-unsigned-${AWUN_VERSION_NAME}-${AWUN_VERSION_CODE}.aab"
          if test -f mobile/android/app/build/outputs/mapping/release/mapping.txt; then
            cp mobile/android/app/build/outputs/mapping/release/mapping.txt dist/google-play-unsigned/mapping.txt
          fi
          cp -R mobile/android/fastlane/metadata dist/google-play-unsigned/store-listing
          cp LICENSE.md EULA.md dist/google-play-unsigned/
          sha256sum dist/google-play-unsigned/*.aab > dist/google-play-unsigned/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AWUN-unsigned-Google-Play-1.8.0-18000
          path: dist/google-play-unsigned
          if-no-files-found: error
          retention-days: 7

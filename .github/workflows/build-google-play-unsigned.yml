name: Android unsigned Play bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-google-play-unsigned.yml"
      - "mobile/android/**"
      - "frontend/**"
      - "VERSION"
      - "LICENSE.md"
      - "EULA.md"

permissions:
  contents: read

jobs:
  bundle:
    name: Unsigned Play AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read canonical project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          core="${version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$core"
          test -n "$major" && test -n "$minor" && test -n "$patch"
          code=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100))
          echo "AWUN_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "AWUN_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Lint and build unsigned app bundle
        run: gradle -p mobile/android --no-daemon :app:clean :app:lintRelease :app:bundleRelease
      - name: Package unsigned Play artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find mobile/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab')
          test "${#bundles[@]}" -eq 1
          mkdir -p dist/google-play-unsigned
          cp "${bundles[0]}" "dist/google-play-unsigned/SONGVALE-unsigned-${AWUN_VERSION_NAME}-${AWUN_VERSION_CODE}.aab"
          if test -f mobile/android/app/build/outputs/mapping/release/mapping.txt; then
            cp mobile/android/app/build/outputs/mapping/release/mapping.txt dist/google-play-unsigned/mapping.txt
          fi
          cp -R mobile/android/fastlane/metadata dist/google-play-unsigned/store-listing
          cp LICENSE.md EULA.md dist/google-play-unsigned/
          sha256sum dist/google-play-unsigned/*.aab > dist/google-play-unsigned/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SONGVALE-unsigned-Google-Play-${{ env.AWUN_VERSION_NAME }}-${{ env.AWUN_VERSION_CODE }}
          path: dist/google-play-unsigned
          if-no-files-found: error
          retention-days: 7

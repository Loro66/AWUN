name: Android Google Play release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Play AAB
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      AWUN_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      AWUN_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      AWUN_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      AWUN_MIRROR_URL: ${{ vars.AWUN_MIRROR_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read canonical project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          core="${version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$core"
          test -n "$major" && test -n "$minor" && test -n "$patch"
          code=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100))
          echo "AWUN_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "AWUN_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate release signing secrets
        shell: bash
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$AWUN_UPLOAD_STORE_PASSWORD"
          test -n "$AWUN_UPLOAD_KEY_ALIAS"
          test -n "$AWUN_UPLOAD_KEY_PASSWORD"
          test "$AWUN_VERSION_CODE" -gt 0
      - name: Restore upload keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/awun-upload.jks"
          test -s "$RUNNER_TEMP/awun-upload.jks"
          echo "AWUN_UPLOAD_KEYSTORE=$RUNNER_TEMP/awun-upload.jks" >> "$GITHUB_ENV"
      - name: Lint and build signed app bundle
        run: gradle -p mobile/android --no-daemon :app:clean :app:lintRelease :app:bundleRelease
      - name: Verify and package Play artifact
        shell: bash
        run: |
          jarsigner -verify mobile/android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist/google-play
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "dist/google-play/SONGVALE-${AWUN_VERSION_NAME}-${AWUN_VERSION_CODE}.aab"
          if test -f mobile/android/app/build/outputs/mapping/release/mapping.txt; then
            cp mobile/android/app/build/outputs/mapping/release/mapping.txt dist/google-play/mapping.txt
          fi
          cp -R mobile/android/fastlane/metadata dist/google-play/store-listing
          sha256sum dist/google-play/*.aab > dist/google-play/SHA256SUMS.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SONGVALE-Google-Play-${{ env.AWUN_VERSION_NAME }}-${{ env.AWUN_VERSION_CODE }}
          path: dist/google-play
          if-no-files-found: error
          retention-days: 30

name: Android Google Play release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Google Play version code
        required: true
        default: "18000"
      version_name:
        description: Public version name
        required: true
        default: "1.8.0"

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Play AAB
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      AWUN_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      AWUN_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      AWUN_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      AWUN_MIRROR_URL: ${{ vars.AWUN_MIRROR_URL }}
      AWUN_VERSION_CODE: ${{ inputs.version_code }}
      AWUN_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate release signing secrets
        shell: bash
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$AWUN_UPLOAD_STORE_PASSWORD"
          test -n "$AWUN_UPLOAD_KEY_ALIAS"
          test -n "$AWUN_UPLOAD_KEY_PASSWORD"
          test "$AWUN_VERSION_CODE" -gt 0
      - name: Restore upload keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/awun-upload.jks"
          test -s "$RUNNER_TEMP/awun-upload.jks"
          echo "AWUN_UPLOAD_KEYSTORE=$RUNNER_TEMP/awun-upload.jks" >> "$GITHUB_ENV"
      - name: Lint and build signed app bundle
        run: gradle -p mobile/android --no-daemon :app:clean :app:lintRelease :app:bundleRelease
      - name: Verify and package Play artifact
        shell: bash
        run: |
          jarsigner -verify mobile/android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist/google-play
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "dist/google-play/AWUN-${AWUN_VERSION_NAME}-${AWUN_VERSION_CODE}.aab"
          if test -f mobile/android/app/build/outputs/mapping/release/mapping.txt; then
            cp mobile/android/app/build/outputs/mapping/release/mapping.txt dist/google-play/mapping.txt
          fi
          cp -R mobile/android/fastlane/metadata dist/google-play/store-listing
          sha256sum dist/google-play/*.aab > dist/google-play/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AWUN-Google-Play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/google-play
          if-no-files-found: error
          retention-days: 30

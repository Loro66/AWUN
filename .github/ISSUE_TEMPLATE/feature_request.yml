name: Feature request
description: Propose a focused product improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Requests to bypass DRM, provider authentication or licensing restrictions will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler approaches.
  - type: dropdown
    id: surface
    attributes:
      label: Product area
      options:
        - Search and discovery
        - Playback and recovery
        - Library and import
        - My Wave
        - Interface and accessibility
        - Diagnostics and reliability
        - Windows packaging
        - Mobile packaging
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require DRM removal, private account scraping or unauthorized media access.
          required: true

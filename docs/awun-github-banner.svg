  <text x="92" y="343" fill="#a8aea3" font-family="Arial,Helvetica,sans-serif" font-size="17">Local-first discovery across fragmented music catalogs.</text>
  <text x="92" y="370" fill="#a8aea3" font-family="Arial,Helvetica,sans-serif" font-size="17">Your library stays on your device. Playback keeps moving.</text>


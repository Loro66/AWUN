<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">SONGVALE — every sound finds a way</title>
  <desc id="desc">SONGVALE product banner showing an original sound-valley mark and resilient multi-source playback.</desc>
  <defs>

plugins { id "com.android.application" }

def envValue = { String name, String fallback ->
    def value = System.getenv(name)
    return value == null || value.trim().isEmpty() ? fallback : value.trim()
}

def javaString = { String value ->
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def uploadKeystore = System.getenv("AWUN_UPLOAD_KEYSTORE")
def uploadStorePassword = System.getenv("AWUN_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = System.getenv("AWUN_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("AWUN_UPLOAD_KEY_PASSWORD")
def uploadSigningReady = [uploadKeystore, uploadStorePassword, uploadKeyAlias, uploadKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.loro66.awun"
    compileSdk 36

    defaultConfig {
        applicationId "com.loro66.awun"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(envValue("AWUN_VERSION_CODE", "18000"))
        versionName envValue("AWUN_VERSION_NAME", "1.8.0")
        buildConfigField "String", "AWUN_PRIMARY_URL", javaString(envValue("AWUN_PRIMARY_URL", "https://awun-api1.onrender.com"))
        buildConfigField "String", "AWUN_MIRROR_URL", javaString(envValue("AWUN_MIRROR_URL", ""))
        buildConfigField "String", "AWUN_CLIENT_ID", javaString("android-play")
    }

    signingConfigs {
        if (uploadSigningReady) {
            upload {
                storeFile file(uploadKeystore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (uploadSigningReady) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "/META-INF/DEPENDENCIES"]
        }
    }
}

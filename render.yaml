services:
  - type: web
    name: awun-1
    runtime: docker
    plan: free
    renderSubdomainPolicy: enabled
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AWUN_MAX_LIMIT
        value: "100"
      - key: AWUN_DEFAULT_LIMIT
        value: "30"
      - key: AWUN_SEARCH_TIMEOUT_SECONDS
        value: "35"
      - key: AWUN_QUERY_EXPANSION_LIMIT
        value: "6"
      - key: AWUN_INTERNET_ARCHIVE_MAX_ITEMS
        value: "8"
      - key: AWUN_MUSICBRAINZ_CONTACT
        value: "https://github.com/Loro66/AWUN"
      - key: AWUN_YOUTUBE_MAX_PAGES
        value: "2"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: AWUN_MEDIA_SECRET
        generateValue: true
      - key: AWUN_LYRICS_ENABLED
        value: "true"
